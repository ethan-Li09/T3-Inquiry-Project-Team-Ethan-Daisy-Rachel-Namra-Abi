<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="contacts.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <img src = https://images.unsplash.com/photo-1512568400610-62da28bc8a13?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGNvZmZlZXxlbnwwfHwwfHx8MA%3D%3D alt = "Coffee image by Nathan Dumlao via Unsplash" ID = "Logo"/>
        <h1 class = "heading-styling">Cozy Nest Cafe</h1>
        <nav>
            <a class = "nav-styles" href =...>Home </a>
            <a class = "nav-styles" href =...>Drinks</a>
            <a class = "nav-styles" href =...>Pastries</a>
            <a class = "nav-styles" href =...>Time & Location</a>
            <input type = "text" placeholder = "search"/>
        </nav>
    </header>
    <main>
        <h2 class = "h2-styling">Contacts</h2>
        <div class = "direction-change">
            <p>Name</p>
            <textarea placeholder = "Type Here" class = "Size-change"></textarea>
            <p>Email</p>
            <textarea placeholder = "Type Here" class = "Size-change"></textarea>
            <p>Address</p>
            <textarea placeholder = "Type Here" class = "Size-change"></textarea>
            <p>Time</p>
            <textarea placeholder = "Type Here" class = "Size-change"></textarea>
            <p>Summary</p>
            <textarea placeholder = "Type Here" class = "Size-change2"></textarea>
            <button class = "button-styling">Submit</button>
        </div>
        <div class = "change-position">
            <img src =https://images.unsplash.com/photo-1453614512568-c4024d13c247?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8Y29mZmVlJTIwc2hvcHxlbnwwfHwwfHx8MA%3D%3D alt = "Coffee Shop image by Nafinia Putra via Unsplash" class = "image-restyle"/>
            <p>Hours:</p>
            <p>7:00 AM to 7:00 PM Every Day</p>
            <p>Location:</p>
            <p>6612, 13th Avenue, Brooklyn</p>
            <p>Media</p>
            <p>@CozyNestCafe</p>
        </div>
    </main>
    <footer>
        <p>Coffee image by Nathan Dumlao via Unsplash</p>
        <p>Coffee Shop image by Nafinia Putra via Unsplash</p>
    </footer>
</body>
</html>
